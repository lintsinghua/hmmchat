[package]
name = "hmmchat"
version = "0.1.4"
description = "A restrained multi-provider AI chat client"
authors = ["lintsinghua"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hmmchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is required for window vibrancy (the sidebar material).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "http2",
] }
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
base64 = "0.22"
url = "2"

[features]
# Used by `tauri build` to produce a smaller binary.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
